name: APK bauen

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bauen
        run: gradle -p android assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Filament.apk
      - name: Veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Filament-App ${{ github.run_number }}
          files: Filament.apk
